syntax = "proto3";

package GameProtocol;

option csharp_namespace = "GameFramework.Network.Protobuf";

// ============================================================
// 消息命名约定：
//   CG_xxx  客户端→服务器（客户端不注册处理器）
//   GC_xxx  服务器→客户端（自动生成处理器注册 + 回调桩）
//   无前缀  内嵌数据消息，不单独走网络
//
// 消息 ID 定义在相同目录的 .id 文件中（如 game.id）
// ============================================================

// @ 心跳
message CG_Heartbeat {
    int64 client_time = 1;
}

message GC_Heartbeat {
    int64 server_time = 1;
}

message GC_ErrorNotify {
    int32 code = 1;
    string message = 2;
}

message CG_Login {
    string account = 1;
    string token = 2;
    int32 platform = 3;
}

message GC_Login {
    int32 player_id = 1;
    string nickname = 2;
    int32 level = 3;
    int64 login_time = 4;
}

// ============================================================
// 内嵌数据消息（不单独走网络，无需在 .id 中定义）
// ============================================================

message PlayerInfo {
    int32 player_id = 1;
    string nickname = 2;
    int32 level = 3;
    int32 exp = 4;
    int64 gold = 5;
    int64 diamond = 6;
    int32 vip_level = 7;
}

message ItemInfo {
    int32 item_id = 1;
    int32 count = 2;
}

message GC_PlayerDataSync {
    PlayerInfo player = 1;
    repeated ItemInfo items = 2;
}
